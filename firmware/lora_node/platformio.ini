; Raspberry Pi Pico (RP2040). All three boards are plain Picos.
[env:pico]
platform = raspberrypi
board = pico
framework = arduino
monitor_speed = 115200
lib_deps = sandeepmistry/LoRa@^0.8.0

; ground station: same firmware, blinks on RX
[env:pico_ground]
extends = env:pico
build_flags = -DGROUND_STATION=1
